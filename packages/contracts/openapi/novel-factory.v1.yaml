openapi: 3.1.0
info:
  title: Novel Factory API
  version: 1.0.0
servers:
  - url: /v1
paths:
  /health:
    get:
      operationId: getGatewayHealth
      responses:
        '200':
          description: Gateway health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /books:
    post:
      operationId: createBook
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /books/{bookId}:
    get:
      operationId: getBook
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /books/{bookId}/chapters:
    get:
      operationId: listBookChapters
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book chapters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /extraction-runs:
    post:
      operationId: createExtractionRun
      responses:
        '202':
          description: Extraction run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /extraction-runs/{runId}:
    get:
      operationId: getExtractionRun
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Extraction run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Extraction run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /extraction-runs/{runId}/report:
    get:
      operationId: getExtractionRunReport
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Extraction run report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /knowledge-objects:
    get:
      operationId: listKnowledgeObjects
      responses:
        '200':
          description: Knowledge objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /knowledge-objects/{objectId}/review-actions:
    post:
      operationId: reviewKnowledgeObject
      parameters:
        - in: path
          name: objectId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewActionCommand'
      responses:
        '200':
          description: Review action applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /graph/summary:
    get:
      operationId: getGraphSummary
      responses:
        '200':
          description: Graph summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /novel-projects:
    post:
      operationId: createNovelProject
      responses:
        '202':
          description: Novel project accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /novel-projects/{projectId}:
    get:
      operationId: getNovelProject
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Novel project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Novel project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /workspaces:
    post:
      operationId: createWorkspace
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /workspaces/{workspaceId}/home:
    get:
      operationId: getWorkspaceHome
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace home aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /chapter-plans:
    post:
      operationId: createChapterPlan
      responses:
        '202':
          description: Chapter plan accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /chapter-plans/{chapterPlanId}:
    get:
      operationId: getChapterPlan
      parameters:
        - in: path
          name: chapterPlanId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chapter plan detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Chapter plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /chapter-plans/{chapterPlanId}/section-plans:
    get:
      operationId: listSectionPlans
      parameters:
        - in: path
          name: chapterPlanId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Section plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
    post:
      operationId: createSectionPlans
      parameters:
        - in: path
          name: chapterPlanId
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Section plans accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /writing-runs:
    post:
      operationId: createWritingRun
      responses:
        '202':
          description: Writing run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /writing-runs/{writingRunId}:
    get:
      operationId: getWritingRun
      parameters:
        - in: path
          name: writingRunId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Writing run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Writing run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /writing-runs/{writingRunId}/accept-chapter:
    post:
      operationId: acceptWritingChapter
      parameters:
        - in: path
          name: writingRunId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Writing chapter accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Writing run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '409':
          description: Writing run acceptance dependencies incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /writing-runs/{writingRunId}/review-actions:
    post:
      operationId: reviewWritingRun
      parameters:
        - in: path
          name: writingRunId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WritingReviewActionCommand'
      responses:
        '200':
          description: Writing review action applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Writing run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /quality-reports/{qualityReportId}:
    get:
      operationId: getQualityReport
      parameters:
        - in: path
          name: qualityReportId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quality report detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Quality report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /consistency-reports/{consistencyReportId}:
    get:
      operationId: getConsistencyReport
      parameters:
        - in: path
          name: consistencyReportId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consistency report detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Consistency report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /revision-summaries/{revisionSummaryId}:
    get:
      operationId: getRevisionSummary
      parameters:
        - in: path
          name: revisionSummaryId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revision summary detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Revision summary not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /feedback-records:
    get:
      operationId: listFeedbackRecords
      parameters:
        - in: query
          name: targetType
          required: false
          schema:
            type: string
        - in: query
          name: targetId
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Feedback records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /rankings/prompt:
    get:
      operationId: getPromptRankingSnapshot
      parameters:
        - in: query
          name: targetId
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Prompt ranking snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /patterns:
    get:
      operationId: listPatterns
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: patternType
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Pattern library items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
    post:
      operationId: createPattern
      responses:
        '201':
          description: Pattern created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /patterns/{patternId}:
    get:
      operationId: getPattern
      parameters:
        - in: path
          name: patternId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pattern detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Pattern not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /rhythm-profiles:
    get:
      operationId: listRhythmProfiles
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: targetId
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Rhythm profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
    post:
      operationId: createRhythmProfile
      responses:
        '201':
          description: Rhythm profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /rhythm-profiles/{rhythmProfileId}:
    get:
      operationId: getRhythmProfile
      parameters:
        - in: path
          name: rhythmProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rhythm profile detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Rhythm profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /assets:
    get:
      operationId: listAssets
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: assetType
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Asset library items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
    post:
      operationId: createAsset
      responses:
        '201':
          description: Asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /assets/{assetId}:
    get:
      operationId: getAsset
      parameters:
        - in: path
          name: assetId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Asset detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /rules:
    get:
      operationId: listRules
      responses:
        '200':
          description: Rule profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /rules/{ruleId}:
    get:
      operationId: getRule
      parameters:
        - in: path
          name: ruleId
          required: true
          schema:
            type: string
      responses:
