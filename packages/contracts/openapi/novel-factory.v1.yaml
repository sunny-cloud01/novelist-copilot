    get:
      operationId: getConfigurationSnapshot
      responses:
        '200':
          description: Configuration snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /model-profiles/{modelProfileId}/enable:
    post:
      operationId: enableModelProfile
      parameters:
        - in: path
          name: modelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model profile enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Model profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /model-profiles/{modelProfileId}/disable:
    post:
      operationId: disableModelProfile
      parameters:
        - in: path
          name: modelProfileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model profile disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Model profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /agent-tasks:
    post:
      operationId: createAgentTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskCommand'
      responses:
        '202':
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
  /agent-tasks/{taskId}:
    get:
      operationId: getAgentTask
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEnvelope'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
components:
  schemas:
    RequestMeta:
      $ref: ../schemas/request-meta.schema.json
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        target:
          type: string
        recovery_hint:
          type: string
      additionalProperties: false
    ApiSuccessEnvelope:
      $ref: ../schemas/api-success-envelope.schema.json
    ApiErrorEnvelope:
      $ref: ../schemas/api-error-envelope.schema.json
    TaskStatus:
      $ref: ../schemas/task-status.schema.json
    Task:
      $ref: ../schemas/task.schema.json
    TaskEvent:
      $ref: ../schemas/task-event.schema.json
    CreateTaskCommand:
      $ref: ../schemas/create-task-command.schema.json
    WorkerCommand:
      $ref: ../schemas/worker-command.schema.json
    WorkerResult:
      $ref: ../schemas/worker-result.schema.json
    SourceBook:
      $ref: ../schemas/source-book.schema.json
    SourceChapter:
      $ref: ../schemas/source-chapter.schema.json
    ExtractionRun:
      $ref: ../schemas/extraction-run.schema.json
    KnowledgeObject:
      $ref: ../schemas/knowledge-object.schema.json
    ReviewActionCommand:
      $ref: ../schemas/review-action-command.schema.json
    GraphSummary:
      $ref: ../schemas/graph-summary.schema.json
    NovelProject:
      $ref: ../schemas/novel-project.schema.json
    Workspace:
      $ref: ../schemas/workspace.schema.json
    WorkspaceMember:
      $ref: ../schemas/workspace-member.schema.json
    WorkspaceHome:
      $ref: ../schemas/workspace-home.schema.json
    StoryBible:
      $ref: ../schemas/story-bible.schema.json
    ChapterPlan:
      $ref: ../schemas/chapter-plan.schema.json
    SectionPlan:
      $ref: ../schemas/section-plan.schema.json
    WritingRun:
      $ref: ../schemas/writing-run.schema.json
    ChapterSnapshot:
      $ref: ../schemas/chapter-snapshot.schema.json
    ManuscriptState:
      $ref: ../schemas/manuscript-state.schema.json
    ConsistencyIssue:
      $ref: ../schemas/consistency-issue.schema.json
    RuleProfile:
      $ref: ../schemas/rule-profile.schema.json
    ConsistencyReport:
      $ref: ../schemas/consistency-report.schema.json
    RevisionSummary:
      $ref: ../schemas/revision-summary.schema.json
    RankingSignal:
      $ref: ../schemas/ranking-signal.schema.json
    RankingSuggestion:
      $ref: ../schemas/ranking-suggestion.schema.json
    RankingSnapshot:
      $ref: ../schemas/ranking-snapshot.schema.json
    Pattern:
      $ref: ../schemas/pattern.schema.json
    RhythmProfile:
      $ref: ../schemas/rhythm-profile.schema.json
    Asset:
      $ref: ../schemas/asset.schema.json
    WritingReviewActionCommand:
      $ref: ../schemas/writing-review-action-command.schema.json
    ModelProfile:
      $ref: ../schemas/model-profile.schema.json
    AgentModelAssignment:
      $ref: ../schemas/agent-model-assignment.schema.json
    ProviderCall:
      $ref: ../schemas/provider-call.schema.json
    ConfigurationSnapshot:
      $ref: ../schemas/configuration-snapshot.schema.json
    QualityReport:
      $ref: ../schemas/quality-report.schema.json
    FeedbackRecord:
      $ref: ../schemas/feedback-record.schema.json
    AuditEvent:
      $ref: ../schemas/audit-event.schema.json
