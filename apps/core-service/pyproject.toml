[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-factory-core-service"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "ulid-py>=1.1,<2.0",
  "httpx>=0.28,<1.0",
  "psycopg[binary]>=3.2,<4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
