name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python app packages
        run: python -m pip install -e apps/api-gateway -e apps/core-service -e apps/ai-worker -e apps/scheduler pytest

      - name: Run root lint gate
        run: pnpm lint

      - name: Run contracts lint
        run: pnpm contracts:lint

      - name: Run contracts tests
        run: pnpm contracts:test

      - name: Run root test gate
        run: pnpm test
